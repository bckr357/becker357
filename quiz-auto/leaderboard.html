<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard – Quiz-Auto</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .5rem; border-bottom: 1px solid #ccc; text-align: left; }
  .online { color: #2e7d32; font-weight: 600; }
</style>
</head>
<body>
<h1>🏆 Leaderboard</h1>
<h2>Gerade online</h2>
<ul id="online"></ul>
<h2>Rangliste</h2>
<table><thead><tr><th>Rang</th><th>Name</th><th>Richtig</th></tr></thead><tbody id="board"></tbody></table>
<script type="module">
  import { onPresence, onLeaderboard } from './presence.js';
  onPresence(v => {
    const ul = document.getElementById('online');
    ul.innerHTML = Object.values(v).map(x => `<li class="online">${x.name}</li>`).join('') || '<li>niemand</li>';
  });
  onLeaderboard(list => {
    const tb = document.getElementById('board');
    tb.innerHTML = list.map((x,i) => `<tr><td>${i+1}</td><td>${x.name}</td><td>${x.correct||0}</td></tr>`).join('');
  });
</script>
</body>
</html>
