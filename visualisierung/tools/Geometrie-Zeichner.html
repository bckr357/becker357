<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometrie-Zeichner</title>
<style>
:root{
 --bg:#fff;--fg:#1a1a1a;--grid:#c8ccd2;--help:#a6b3c9;--bar:#f1f2f4;--acc:#d9480f;--btn:#fff;--bd:#b9bdc4;--on:#1c5fd4;--onf:#fff;
 --c-draw:#cfe2ff;--c-draw-bd:#8bb9fe;--c-draw-on:#1558c4;
 --c-edit:#ccefd9;--c-edit-bd:#7dd3a2;--c-edit-on:#157a4b;
 --c-const:#e4d4ff;--c-const-bd:#b899f5;--c-const-on:#5e35b1;
 --c-act:#ffffff;--c-act-bd:#b9bdc4;--c-act-on:#1a1a1a;
 --c-ctrl:#ffe6b8;--c-ctrl-bd:#f2be66;--c-ctrl-on:#a85d00;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#17191c;--fg:#eee;--grid:#4a4f57;--help:#6c7889;--bar:#24272b;--acc:#ff8c4a;--btn:#2d3136;--bd:#555b64;--on:#6ea0ff;--onf:#111;
 --c-draw:#1a3154;--c-draw-bd:#3a69b0;--c-draw-on:#4a89e8;
 --c-edit:#143827;--c-edit-bd:#2a7350;--c-edit-on:#24a868;
 --c-const:#2d1e4d;--c-const-bd:#60429e;--c-const-on:#885ce0;
 --c-act:#2d3136;--c-act-bd:#555b64;--c-act-on:#eee;
 --c-ctrl:#473212;--c-ctrl-bd:#996b24;--c-ctrl-on:#d99226
}}
:root[data-theme="dark"]{
 --bg:#17191c;--fg:#eee;--grid:#4a4f57;--help:#6c7889;--bar:#24272b;--acc:#ff8c4a;--btn:#2d3136;--bd:#555b64;--on:#6ea0ff;--onf:#111;
 --c-draw:#1a3154;--c-draw-bd:#3a69b0;--c-draw-on:#4a89e8;
 --c-edit:#143827;--c-edit-bd:#2a7350;--c-edit-on:#24a868;
 --c-const:#2d1e4d;--c-const-bd:#60429e;--c-const-on:#885ce0;
 --c-act:#2d3136;--c-act-bd:#555b64;--c-act-on:#eee;
 --c-ctrl:#473212;--c-ctrl-bd:#996b24;--c-ctrl-on:#d99226
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 10px;background:var(--bar)}
#opts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;width:100%}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px}
.grp.full{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px}
.grp b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.65}
.g{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:5px 9px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--on);color:var(--onf);border-color:var(--on)}
button.cat-draw{background:var(--c-draw);border-color:var(--c-draw-bd)}
button.cat-draw.on{background:var(--c-draw-on);border-color:var(--c-draw-on);color:#fff}
button.cat-edit{background:var(--c-edit);border-color:var(--c-edit-bd)}
button.cat-edit.on{background:var(--c-edit-on);border-color:var(--c-edit-on);color:#fff}
button.cat-const{background:var(--c-const);border-color:var(--c-const-bd)}
button.cat-const.on{background:var(--c-const-on);border-color:var(--c-const-on);color:#fff}
button.cat-ctrl{background:var(--c-ctrl);border-color:var(--c-ctrl-bd)}
button.cat-ctrl.on{background:var(--c-ctrl-on);border-color:var(--c-ctrl-on);color:#fff}
button.cat-act{background:var(--c-act);border-color:var(--c-act-bd)}
button.cat-act.on{background:var(--c-act-on);border-color:var(--c-act-on);color:var(--bg)}
#georeset{padding:5px}
#brec{width:160px;white-space:nowrap}
#bplay{width:110px;white-space:nowrap}
#bprev,#bnext{width:34px;padding-left:0;padding-right:0}
#tog{width:125px;white-space:nowrap}
#themeBtn{padding:5px 8px;line-height:1}
#brec.recording{background:var(--btn);border-color:#d98a8f}
.rec-dot{color:var(--fg);font-size:1.15em}
#brec.recording .rec-dot{color:#d71920;animation:rec-blink 1.8s ease-in-out infinite}
@keyframes rec-blink{0%,35%,65%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#brec.recording .rec-dot{animation:none}}
label{display:flex;gap:5px;align-items:center;cursor:pointer}
label:has(:disabled){opacity:.45;cursor:default}
input[type=range]{width:90px}
.pal-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.swatch{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid rgba(128,128,128,.45);cursor:pointer;position:relative;flex:0 0 auto}
.swatch.active{outline:2px solid var(--fg);outline-offset:1px;border-color:var(--fg)}
.rainbow-pick{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--bd);background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff2d55,#ff3b30);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;flex:0 0 auto}
.rainbow-pick input[type=color]{position:absolute;inset:-6px;width:34px;height:34px;opacity:0;cursor:pointer;border:0;padding:0}
select{font:inherit;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:5px;padding:2px 5px}
#w{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#inpBox{position:absolute;display:none;align-items:center;gap:4px;background:var(--bar);border:1px solid var(--bd);border-radius:6px;padding:3px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#inp{width:84px;font:inherit;padding:2px 4px;border:1px solid var(--bd);border-radius:4px;background:var(--btn);color:var(--fg)}
#inpOk{padding:2px 7px;font-size:12px}
#ctxMenu{position:absolute;display:none;flex-direction:column;gap:8px;min-width:240px;background:var(--bar);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.24);font-size:13px}
#ctxMenu .ctx-hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--bd)}
#ctxMenu .ctx-title{font-weight:700;font-size:14px;letter-spacing:.01em;color:var(--fg)}
#ctxMenu .ctx-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ctxMenu input[type=text]{width:115px;font:inherit;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--btn);color:var(--fg)}
#ctxMenu .ctx-close{border:none;background:transparent;padding:2px 6px;font-size:14px;opacity:.75;border-radius:4px}
#ctxMenu .ctx-close:hover{opacity:1;background:var(--btn)}
#ctxMenu .ctx-dup{width:100%;text-align:center;font-weight:500}
#hint{padding:4px 10px;font-size:12px;opacity:.75}
</style></head><body>
<div id="bar">
 <div class="grp full"><b>Werkzeuge</b><div class="g" id="modes"></div>
  <div class="g"><button id="undo" class="cat-act">↶ Zurück</button><button id="clr" class="cat-act">Alles löschen</button><button id="tog" class="cat-act">▲ ausblenden</button><button id="themeBtn" type="button" title="Hell/Dunkel wechseln" aria-label="Hell/Dunkel wechseln">☾</button></div></div>
 <div id="opts">
  <div class="grp"><b>Raster</b><div class="g" id="grids"></div><label>Größe <input type="range" id="sz" min="20" max="150" value="100"></label>
   <label>Schrittweite <select id="step"><option value="1">1</option><option value="0.5" selected>0,5</option><option value="0.25">0,25</option><option value="0.2">0,2</option><option value="0.1">0,1</option></select></label>
   <label><input type="checkbox" id="coords"> Koordinatensystem</label></div>
  <div class="grp"><b>Zeichnen</b>
   <label><input type="checkbox" id="ras" checked> am Raster fangen</label>
   <label><input type="checkbox" id="fix" > freie Längen</label>
   <label><input type="checkbox" id="auto" checked> Punkte benennen</label>
   <label><input type="checkbox" id="autol" checked> Strecken benennen</label>
   <label><input type="checkbox" id="autof" checked> Flächen benennen</label></div>
  <div class="grp"><b>Anzeige</b>
   <label><input type="checkbox" id="lab" checked> Bezeichnungen</label>
   <label><input type="checkbox" id="leg" checked> Legende</label>
   <label><input type="checkbox" id="legpts"> Punkte in Legende</label>
   <label><input type="checkbox" id="geo"> Geodreieck anzeigen</label>
   <button id="georeset" type="button">Drehung zurücksetzen</button></div>
  <div class="grp"><b>Darstellung</b>
   <label>Schriftgröße <input type="range" id="fs" min="12" max="36" value="20"></label>
   <label>Einheit <select id="unit"><option value="mm">mm</option><option value="cm" selected>cm</option><option value="dm">dm</option><option value="m">m</option><option value="km">km</option></select></label>
   <b>Punkte</b><div class="g" id="ptypes"></div>
   <div class="pal-row"><span>Farbe</span><span id="mainSwatches" class="pal-row"></span><span class="rainbow-pick" title="Eigene Farbe wählen"><input type="color" id="fc" value="#1a1a1a"></span></div></div>
  <div class="grp"><b>Berechnungen</b>
   <label><input type="checkbox" id="d3"> Winkel und Längen in 3D</label>
   <label><input type="checkbox" id="siz"> Größen anzeigen</label>
   <label><input type="checkbox" id="onlyn"> ... an allen Strecken</label>
   <label><input type="checkbox" id="sol"> Lösungswege</label></div>
  <div class="grp"><b>Rekorder</b>
   <div class="g"><button id="brec">● Aufnahme starten</button><button id="bplay">▶ Abspielen</button></div>
   <div class="g"><button id="bsave">💾 Speichern</button><button id="bload">📂 Laden</button><input type="file" id="bfile" accept=".json,application/json" style="display:none"></div>
   <label>Geschwindigkeit <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1"></label>
   <div class="g"><button id="bprev" title="Vorheriger Schritt" aria-label="Vorheriger Schritt">◀</button><button id="bnext" title="Nächster Schritt" aria-label="Nächster Schritt">▶</button></div>
   <span id="rinfo" style="font-size:12px;opacity:.75"></span></div>
 </div>
</div>
<div id="w"><canvas id="c"></canvas>
 <div id="inpBox"><input id="inp" maxlength="100"><button id="inpOk" type="button">OK</button></div>
 <div id="ctxMenu" role="dialog" aria-label="Objekt-Inspector"></div>
</div>
<div id="hint"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),inp=$('inp'),inpBox=$('inpBox'),inpOk=$('inpOk'),ctxMenu=$('ctxMenu');
let P=[],L=[],K=[],A=[],F=[],BD=[],Q=[],nid=1,hist=[],start=null,sel=[],multiSel=[],bsel=null,mode='line',grid='dots',showGrid=true,ptStyle='cross',hover=null,hl=-1,hk=-1,W=0,H=0,k=100,ox=0,oy=0,fs=16,mouse={x:0,y:0},drag=null,space=false,M=new Map(),crossKey='',crossCache=[],legPos=null,legR=null,legRows=[],rec=false,snaps=[],manualStep=-1,playing=false,live=null,pi=0,pt=null,touchPointers=new Map(),pinch=null,touchTap=null,touchGesture=false,touchHoldTimer=null,touchLongPressed=false,touchMoved=false,lastTouchTapTime=0,lastTouchTapPos=null,lastTwoFingerTapTime=0,twoFingerMoved=false,isTouch=false,geoPos=null,geoDrag=null,geoSize=100,geoAngle=0,compass=null,ctxTargets=null,rmbDown=null;
const STD_COLORS=['#1a1a1a','#d92626','#1c64f2','#0e9f6e','#e3a008'];
const geoImg=new Image();
geoImg.src='Geodreieck.png';
let geoAlpha=null;
geoImg.onload=()=>{const c=document.createElement('canvas');c.width=geoImg.naturalWidth;c.height=geoImg.naturalHeight;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(geoImg,0,0);geoAlpha=g.getImageData(0,0,c.width,c.height).data;draw()};
const GR='αβγδεζηθικλμνξπρστφχψω',LC='abcdefghijklmnopqrstuvwxyz';
const MODES=[
  ['line','Strecke (S)','cat-draw'],
  ['point','Punkt (P)','cat-draw'],
  ['arc','Kreis (K)','cat-draw'],
  ['style','Stil (G)','cat-edit'],
  ['label','Beschriften (B)','cat-edit'],
  ['text','Text (T)','cat-edit'],
  ['angle','Winkel (W)','cat-const'],
  ['face','Fläche (F)','cat-const'],
  ['select','Zeiger (Z)','cat-ctrl'],
  ['del','Löschen (L)','cat-ctrl']
];
const KEYS={z:'select',s:'line',p:'point',k:'arc',g:'style',b:'label',t:'text',w:'angle',f:'face',l:'del'};
const HINTS={
 select:'Objekt anklicken und ziehen zum Verschieben. Strg+Klick wählt mehrere Objekte für gemeinsames Verschieben oder Formatieren per Rechtsklick.',
 line:'Punkt anklicken/antippen, Maus bewegen und erneut klicken (Touch: ziehen & loslassen oder zweimal tippen). Rechtsklick ziehen: Zeichenfläche verschieben.',
 point:'Klick oder Tippen setzt einen Punkt (rastet an Schnittpunkten ein und bleibt verankert). Rechtsklick ziehen: Zeichenfläche verschieben.',
 arc:'Zirkel: Mittelpunkt anklicken/antippen, Radius aufziehen/klicken zum Sperren, dann um den Mittelpunkt kreisen.',
 label:'Punkt, Strecke, Kreis, Winkelbogen oder Fläche anklicken/antippen, Namen eingeben (tiefgestellt: F_1 oder k_1), Enter.',
 text:'Klick oder Tippen an die gewünschte Stelle, Text eingeben und Enter drücken. Esc bricht ab.',
 style:'Strecke oder Kreisbogen anklicken/antippen: normal → gestrichelt → Hilfslinie.',
 angle:'Nacheinander anklicken/antippen: Punkt auf Schenkel 1, Scheitelpunkt, Punkt auf Schenkel 2 (gegen den Uhrzeigersinn für > 180°).',
 face:'Vieleck: Punkte der Reihe nach wählen, ersten Punkt erneut wählen, Enter oder Doppeltipp schließt. Kreisfläche: Mittelpunkt, dann Punkt auf Kreislinie wählen.',
 del:'Punkt, Strecke, Kreisbogen, Winkelbogen, Fläche oder Text anklicken/antippen zum Löschen.'
};
const sp=()=>start===null?null:start.id!==undefined?M.get(start.id):start;
const fmt=(n,d=2)=>(+n.toFixed(d)).toString().replace('.',',');
const X=x=>ox+x*k,Y=y=>oy+y*k,wx=x=>(x-ox)/k,wy=y=>(y-oy)/k;
const S=()=>[P,L,K,A,F,BD,Q,nid],snap=()=>JSON.stringify(S()),load=a=>{[P,L,K,A,F,BD,Q,nid]=a.length==8?a:[...a.slice(0,6),[],a[6]]};
const vis=o=>o&&o.vis!==false;
const curColor=()=>$('fc').value||'#1a1a1a';

function renderSwatches(container, activeHex, onPick){
 container.innerHTML='';
 STD_COLORS.forEach(hex=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='swatch'+(activeHex&&activeHex.toLowerCase()===hex.toLowerCase()?' active':'');
  b.style.background=hex;
  b.title=hex;
  b.onclick=e=>{e.stopPropagation();onPick(hex)};
  container.appendChild(b);
 });
}
function refreshMainSwatches(){
 renderSwatches($('mainSwatches'),curColor(),hex=>{$('fc').value=hex;refreshMainSwatches();draw()});
}

function effectiveDark(){
 const r=document.documentElement.dataset.theme;
 if(r==='dark')return true;
 if(r==='light')return false;
 return matchMedia('(prefers-color-scheme:dark)').matches;
}
function syncThemeIcon(){
 $('themeBtn').textContent=effectiveDark()?'☀':'☾';
}
$('themeBtn').onclick=e=>{
 e.target.blur();
 const next=effectiveDark()?'light':'dark';
 document.documentElement.dataset.theme=next;
 syncThemeIcon();
 draw();
};

function btns(el,arr,cur,fn){el.innerHTML='';arr.forEach(([key,t,cls])=>{const b=document.createElement('button');b.textContent=t;b.className=(cls?cls+' ':'')+(cur()==key?'on':'');b.onclick=()=>{fn(key);btns(el,arr,cur,fn);draw()};el.appendChild(b)})}
function ui(){
 btns($('modes'),MODES,()=>mode,setMode);
 btns($('grids'),[['dots','Punkte'],['karo','Karo'],['off','Aus']],()=>showGrid?grid:'off',key=>{if(key=='off')showGrid=false;else{showGrid=true;grid=key}});
 btns($('ptypes'),[['cross','Kreuz'],['circle','Kreis'],['plus','Strich']],()=>ptStyle,key=>{ptStyle=key;draw()});
}
function hideCtx(){ctxMenu.style.display='none';ctxTargets=null}
function cancelActive(){start=null;sel=[];multiSel=[];bsel=null;compass=null;drag=null;pinch=null;rmbDown=null;hideCtx();$('hint').textContent=HINTS[mode]}
function setMode(m){mode=m;cancelActive();inpBox.style.display='none';cv.style.cursor=m=='select'?'default':'crosshair';ui();draw()}
function resize(){const r=cv.parentNode.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(!ox&&!oy){ox=Math.round(W/2);oy=Math.round(H/2)}draw()}
new ResizeObserver(()=>resize()).observe($('w'));
$('tog').onclick=e=>{const o=$('opts'),h=o.style.display=='none';o.style.display=h?'flex':'none';e.target.textContent=h?'▲ ausblenden':'▼ einblenden';e.target.blur()};
const push=()=>{hist.push(snap());if(hist.length>100)hist.shift();if(rec&&!drag)setTimeout(capture,0)};
function undo(){if(playing)return;if(hist.length){if(rec&&snaps.length>1)snaps.pop();load(JSON.parse(hist.pop()));cancelActive();rebuild();draw()}}
$('undo').onclick=e=>{e.target.blur();undo()};
$('clr').onclick=e=>{e.target.blur();if(playing)return;if(P.length||Q.length||K.length||F.length){push();P=[];L=[];K=[];A=[];F=[];BD=[];Q=[];cancelActive();rebuild();draw()}};
/* Rekorder */
function capture(){if(!rec)return;const s=snap();if(snaps[snaps.length-1]!==s)snaps.push(s);recUI()}
function show(i){load(JSON.parse(snaps[i]));cancelActive();rebuild();draw();const total=Math.max(1,snaps.length-1);$('rinfo').textContent=i?'Schritt '+Math.min(total,i)+' von '+total:'Grundzustand'}
function recUI(){$('brec').innerHTML=rec?'<span class="rec-dot" aria-hidden="true">●</span> Aufnahme beenden':'<span class="rec-dot" aria-hidden="true">●</span> Aufnahme starten';$('brec').className=rec?'recording':'';$('bplay').textContent=playing?'■ Anhalten':'▶ Abspielen';$('bplay').className=playing?'on':'';
 $('bprev').disabled=snaps.length<2||rec||playing;$('bnext').disabled=snaps.length<2||rec||playing;$('bsave').disabled=snaps.length<2;
 if(rec)$('rinfo').textContent='Aufnahme läuft: '+(snaps.length-1)+' Schritte';else if(!playing)$('rinfo').textContent=snaps.length>1?(snaps.length-1)+' Schritte aufgenommen':''}
function toggleRec(){if(playing)stop();rec=!rec;if(rec)snaps=[snap()];manualStep=-1;recUI()}
function play(){if(snaps.length<2){$('rinfo').textContent='Erst aufnehmen: mindestens ein Schritt nötig';return}rec=false;live=snap();playing=true;pi=0;start=null;sel=[];recUI();playStep()}
function playStep(){if(!playing)return;show(pi);const last=pi==snaps.length-1;pi=last?0:pi+1;const speed=+$('speed').value||1;pt=setTimeout(playStep,(last?2.5:1)/speed*1000)}
function moveStep(direction){if(snaps.length<2||rec||playing)return;manualStep=(manualStep+direction+snaps.length)%snaps.length;show(manualStep)}
function stop(){playing=false;clearTimeout(pt);if(live){load(JSON.parse(live));live=null;rebuild();draw()}recUI()}
$('brec').onclick=e=>{e.currentTarget.blur();toggleRec()};$('bplay').onclick=e=>{e.currentTarget.blur();playing?stop():play()};$('bprev').onclick=e=>{e.currentTarget.blur();moveStep(-1)};$('bnext').onclick=e=>{e.currentTarget.blur();moveStep(1)};
let dl=null;
try{if(typeof claude!=='undefined'&&claude.use)claude.use('downloads').then(x=>{dl=x}).catch(()=>{dl=null})}catch(e){dl=null}
$('bsave').onclick=async e=>{e.target.blur();if(snaps.length<2)return;const data=JSON.stringify({typ:'schraegbild-aufnahme',v:1,steps:snaps.map(s=>JSON.parse(s))});
 try{if(dl)await dl.save({filename:'konstruktion.json',data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='konstruktion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}$('rinfo').textContent='Aufnahme gespeichert'}catch(err){if(!err||err.code!='declined')$('rinfo').textContent='Speichern nicht möglich'}};
$('bload').onclick=e=>{e.target.blur();$('bfile').click()};
$('bfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.steps||d.steps.length<2||!d.steps.every(s=>Array.isArray(s)&&(s.length==7||s.length==8)))throw 0;if(playing)stop();rec=false;snaps=d.steps.map(s=>JSON.stringify(s));recUI();play()}catch(x){$('rinfo').textContent='Datei konnte nicht gelesen werden'}};r.readAsText(f)};
function sync(){$('fix').disabled=!$('ras').checked;$('step').disabled=!$('ras').checked||$('fix').checked;$('legpts').disabled=!$('leg').checked}
document.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{
 c.blur();
 if(c.id==='leg'&&c.checked)legPos=null;

/* Geodreieck-Snapping nur mit dem Nullpunkt */
function snapGeodreieckZero(rawX,rawY){
 if(!$('ras').checked)return{x:rawX,y:rawY};
 const step=+$('step').value||0.5;
 const snapTolWorld=14/k;
 let bestX=Math.round(rawX/step)*step,bestY=Math.round(rawY/step)*step;
 let bestD=Math.hypot(bestX-rawX,bestY-rawY);
 if(bestD>snapTolWorld*1.5){bestX=rawX;bestY=rawY}
 for(const p of P){
  if(!vis(p))continue;
  const d=Math.hypot(p.x-rawX,p.y-rawY);
  if(d<snapTolWorld&&d<bestD){bestD=d;bestX=p.x;bestY=p.y}
 }
 return{x:bestX,y:bestY};
}

function collectPtsFromTargets(targets){
 const pts=[];const ids=new Set();
 const addPt=p=>{if(p&&!ids.has(p.id)){pts.push(p);ids.add(p.id)}};
 targets.forEach(t=>{
  if(!t)return;
  const o=t.obj;
  if(t.kind==='p')addPt(o);
  else if(t.kind==='l'){addPt(M.get(o.a));addPt(M.get(o.b))}
  else if(t.kind==='k'){addPt(M.get(o.a));if(o.b!=null)addPt(M.get(o.b))}
  else if(t.kind==='a'){addPt(M.get(o.a));addPt(M.get(o.b));addPt(M.get(o.c))}
  else if(t.kind==='f'){if(o.kind==='circle'){addPt(M.get(o.center));addPt(M.get(o.pt))}else o.p.forEach(id=>addPt(M.get(id)))}
  else if(t.kind==='t')pts.push(o);
 });
 K.forEach(o=>{
  if(o.s=='circle'&&o.b!=null&&ids.has(o.a)&&!ids.has(o.b)){
   addPt(M.get(o.b));
  }
 });
 return pts;
}

function buildMovePts(basePts){

 const ids=new Set(pts.map(p=>p.id));
 K.forEach(o=>{
  if(o.s=='circle'&&o.b!=null&&ids.has(o.a)&&!ids.has(o.b)){
   const ep=M.get(o.b);
   if(ep){pts.push(ep);ids.add(ep.id)}
  }
 });
 return pts;
}
