<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometrie-Zeichner</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--grid:#c8ccd2;--help:#a6b3c9;--bar:#f1f2f4;--acc:#d9480f;--btn:#fff;--bd:#b9bdc4;--on:#1c5fd4;--onf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--fg:#eee;--grid:#4a4f57;--help:#6c7889;--bar:#24272b;--acc:#ff8c4a;--btn:#2d3136;--bd:#555b64;--on:#6ea0ff;--onf:#111}}
:root[data-theme="dark"]{--bg:#17191c;--fg:#eee;--grid:#4a4f57;--help:#6c7889;--bar:#24272b;--acc:#ff8c4a;--btn:#2d3136;--bd:#555b64;--on:#6ea0ff;--onf:#111}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 10px;background:var(--bar)}
#opts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;width:100%}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px}
.grp.full{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px}
.grp b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.65}
.g{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;padding:5px 9px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--on);color:var(--onf);border-color:var(--on)}
#brec{width:160px;white-space:nowrap}
#bplay{width:110px;white-space:nowrap}
#bprev,#bnext{width:34px;padding-left:0;padding-right:0}
#tog{width:125px;white-space:nowrap}
#brec.recording{background:var(--btn);border-color:#d98a8f}
.rec-dot{color:var(--fg);font-size:1.15em}
#brec.recording .rec-dot{color:#d71920;animation:rec-blink 1.8s ease-in-out infinite}
@keyframes rec-blink{0%,35%,65%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#brec.recording .rec-dot{animation:none}}
label{display:flex;gap:5px;align-items:center;cursor:pointer}
label:has(:disabled){opacity:.45;cursor:default}
input[type=range]{width:90px}
input[type=color]{width:32px;height:26px;padding:0;border:0px solid var(--bd);border-radius:6px;background:transparent}
select{font:inherit}
#w{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#inp{position:absolute;display:none;width:70px;font:inherit;padding:2px}
#hint{padding:4px 10px;font-size:12px;opacity:.75}
</style></head><body>
<div id="bar">
 <div class="grp full"><b>Werkzeuge</b><div class="g" id="modes"></div>
  <div class="g"><button id="undo">↶ Zurück</button><button id="clr">Alles löschen</button><button id="tog">▲ ausblenden</button></div></div>
 <div id="opts">
  <div class="grp"><b>Raster</b><div class="g" id="grids"></div><label>Größe <input type="range" id="sz" min="20" max="150" value="100"></label>
   <label>Schrittweite <select id="step"><option value="1">1</option><option value="0.5" selected>0,5</option><option value="0.25">0,25</option><option value="0.2">0,2</option><option value="0.1">0,1</option></select></label></div>
  <div class="grp"><b>Zeichnen</b>
   <label><input type="checkbox" id="ras" checked> am Raster fangen</label>
   <label><input type="checkbox" id="fix" > freie Längen</label>
   <label><input type="checkbox" id="auto" checked> Punkte benennen</label>
   <label><input type="checkbox" id="autol" checked> Strecken benennen</label></div>
  <div class="grp"><b>Anzeige</b>
   <label><input type="checkbox" id="lab" checked> Bezeichnungen</label>
   <label><input type="checkbox" id="cross" checked> Punkte als Kreuz</label>
   <label><input type="checkbox" id="geo"> Geodreieck anzeigen</label>
   <button id="georeset" type="button">Drehung zurücksetzen</button></div>
  <div class="grp"><b>Darstellung</b>
   <label>Schriftgröße <input type="range" id="fs" min="12" max="36" value="20"></label>
   <label>Füllfarbe (Fläche) <input type="color" id="fc" value="#4da3ff"></label>
   <label>Einheit <select id="unit"><option value="mm">mm</option><option value="cm" selected>cm</option><option value="dm">dm</option><option value="m">m</option><option value="km">km</option></select></label></div>
  <div class="grp"><b>Berechnungen</b>
   <label><input type="checkbox" id="d3"> Winkel und Längen in 3D</label>
   <label><input type="checkbox" id="siz"> Größen anzeigen</label>
   <label><input type="checkbox" id="onlyn"> ... an allen Strecken</label>
   <label><input type="checkbox" id="leg" checked> Legende</label>
   <!-- <label><input type="checkbox" id="vol"> Volumen der Körper</label>
   <label><input type="checkbox" id="sol"> Lösungswege</label>
   <label>Körper-Typ <select id="btype"><option value="pyr">Pyramide / Kegel</option><option value="pri">Prisma / Zylinder</option></select></label> -->
   <label><input type="checkbox" id="sol"> Lösungswege</label></div>
  <div class="grp"><b>Rekorder</b>
   <div class="g"><button id="brec">● Aufnahme starten</button><button id="bplay">▶ Abspielen</button></div>
   <div class="g"><button id="bsave">💾 Speichern</button><button id="bload">📂 Laden</button><input type="file" id="bfile" accept=".json,application/json" style="display:none"></div>
   <label>Geschwindigkeit <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1"></label>
   <div class="g"><button id="bprev" title="Vorheriger Schritt" aria-label="Vorheriger Schritt">◀</button><button id="bnext" title="Nächster Schritt" aria-label="Nächster Schritt">▶</button></div>
   <span id="rinfo" style="font-size:12px;opacity:.75"></span></div>
 </div>
</div>
<div id="w"><canvas id="c"></canvas><input id="inp" maxlength="100"></div>
<div id="hint"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),inp=$('inp');
let P=[],L=[],K=[],A=[],F=[],BD=[],Q=[],nid=1,hist=[],start=null,sel=[],bsel=null,mode='line',grid='dots',showGrid=true,hover=null,hl=-1,hk=-1,W=0,H=0,k=100,ox=0,oy=0,fs=16,mouse={x:0,y:0},drag=null,space=false,M=new Map(),crossKey='',crossCache=[],legPos=null,legR=null,legRows=[],rec=false,snaps=[],manualStep=-1,playing=false,live=null,pi=0,pt=null,touchPointers=new Map(),pinch=null,geoPos=null,geoDrag=null,geoSize=100,geoAngle=0,compass=null;
const geoImg=new Image();
geoImg.src='Geodreieck.png';
let geoAlpha=null;
geoImg.onload=()=>{const c=document.createElement('canvas');c.width=geoImg.naturalWidth;c.height=geoImg.naturalHeight;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(geoImg,0,0);geoAlpha=g.getImageData(0,0,c.width,c.height).data;draw()};
const GR='αβγδεζηθικλμνξπρστφχψω',LC='abcdefghijklmnopqrstuvwxyz',PAL=['#4da3ff','#ffb347','#6fd08c','#ff7b9c','#b48cff','#ffd84d','#4dd0c8','#ff8c66'];
const MODES=[['line','Strecke (S)'],['point','Punkt (P)'],['arc','Kreis (K)'],['style','Stil (G)'],['label','Beschriften (B)'],['text','Text (T)'],['move','Verschieben (V)'],['angle','Winkel (W)'],['face','Fläche (F)'],/* ['body','Körper (O)'], */['hand','Hand (H)'],['del','Löschen (L)']];
const KEYS={s:'line',p:'point',k:'arc',g:'style',b:'label',t:'text',v:'move',w:'angle',f:'face',/* o:'body', */h:'hand',l:'del'};
const HINTS={line:'Punkt oder Schnittpunkt anklicken, Maus bewegen, zweiter Klick setzt das Ende. Klick auf einen vorhandenen Punkt verbindet frei. Esc bricht ab.',point:'Klick setzt einen Punkt (rastet an Schnittpunkten von Strecken ein und bleibt daran verankert).',arc:'Zirkel: Mittelpunkt anklicken, Radius festlegen und mit dem zweiten Klick sperren. Danach Maus um den Mittelpunkt bewegen; der Kreis wird schrittweise gezeichnet. Esc bricht ab.',label:'Punkt, Strecke, Winkelbogen oder Fläche anklicken, Namen eingeben (tiefgestellt: F_1 oder F_{12}), Enter.',text:'Klick an die gewünschte Stelle, Text eingeben und Enter drücken. Esc bricht ab.',style:'Strecke oder Kreisbogen anklicken: normal → gestrichelt → Hilfslinie.',move:'Punkt, Strecke oder Text ziehen, angrenzende Strecken wandern mit.',angle:'Nacheinander anklicken: Punkt auf Schenkel 1, Scheitelpunkt, Punkt auf Schenkel 2.',face:'Punkte der Reihe nach anklicken; ersten Punkt erneut anklicken oder Enter schließt die Fläche.',/* body:'Grundfläche anklicken (in die Fläche, oder eine waagerechte Strecke als Kreisdurchmesser), dann Spitze bzw. einen Punkt der Deckfläche. Typ unter Berechnungen. Löschen: in der Legende anklicken.', */hand:'Zeichenfläche ziehen. Alternativ: rechte/mittlere Maustaste oder Leertaste. Mausrad zoomt.',del:'Punkt, Strecke, Kreisbogen, Winkelbogen, Fläche oder Text anklicken zum Löschen.'};
const sp=()=>start===null?null:start.id!==undefined?M.get(start.id):start;
const fmt=(n,d=2)=>(+n.toFixed(d)).toString().replace('.',',');
const X=x=>ox+x*k,Y=y=>oy+y*k,wx=x=>(x-ox)/k,wy=y=>(y-oy)/k;
const S=()=>[P,L,K,A,F,BD,Q,nid],snap=()=>JSON.stringify(S()),load=a=>{[P,L,K,A,F,BD,Q,nid]=a.length==8?a:[...a.slice(0,6),[],a[6]]};
function btns(el,arr,cur,fn){el.innerHTML='';arr.forEach(([key,t])=>{const b=document.createElement('button');b.textContent=t;b.className=cur()==key?'on':'';b.onclick=()=>{fn(key);btns(el,arr,cur,fn);draw()};el.appendChild(b)})}
function ui(){btns($('modes'),MODES,()=>mode,setMode);btns($('grids'),[['dots','Punkte'],['karo','Karo'],['off','Aus']],()=>showGrid?grid:'off',key=>{if(key=='off')showGrid=false;else{showGrid=true;grid=key}})}
function setMode(m){mode=m;start=null;sel=[];bsel=null;compass=null;drag=null;inp.style.display='none';$('hint').textContent=HINTS[m];cv.style.cursor=m=='hand'?'grab':m=='move'?'move':'crosshair';ui();draw()}
function resize(){const r=cv.parentNode.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}
new ResizeObserver(()=>resize()).observe($('w'));
$('tog').onclick=e=>{const o=$('opts'),h=o.style.display=='none';o.style.display=h?'flex':'none';e.target.textContent=h?'▲ ausblenden':'▼ einblenden';e.target.blur()};
const push=()=>{hist.push(snap());if(hist.length>100)hist.shift();if(rec&&!drag)setTimeout(capture,0)};
function undo(){if(playing)return;if(hist.length){if(rec&&snaps.length>1)snaps.pop();load(JSON.parse(hist.pop()));start=null;sel=[];bsel=null;compass=null;drag=null;rebuild();draw()}}
$('undo').onclick=e=>{e.target.blur();undo()};
$('clr').onclick=e=>{e.target.blur();if(playing)return;if(P.length||Q.length){push();P=[];L=[];K=[];A=[];F=[];BD=[];Q=[];start=null;sel=[];bsel=null;compass=null;drag=null;rebuild();draw()}};
/* Rekorder */
function capture(){if(!rec)return;const s=snap();if(snaps[snaps.length-1]!==s)snaps.push(s);recUI()}
function show(i){load(JSON.parse(snaps[i]));start=null;sel=[];bsel=null;rebuild();draw();const total=Math.max(1,snaps.length-1);$('rinfo').textContent=i?'Schritt '+Math.min(total,i)+' von '+total:'Grundzustand'}
function recUI(){$('brec').innerHTML=rec?'<span class="rec-dot" aria-hidden="true">●</span> Aufnahme beenden':'<span class="rec-dot" aria-hidden="true">●</span> Aufnahme starten';$('brec').className=rec?'recording':'';$('bplay').textContent=playing?'■ Anhalten':'▶ Abspielen';$('bplay').className=playing?'on':'';
 $('bprev').disabled=snaps.length<2||rec||playing;$('bnext').disabled=snaps.length<2||rec||playing;$('bsave').disabled=snaps.length<2;
 if(rec)$('rinfo').textContent='Aufnahme läuft: '+(snaps.length-1)+' Schritte';else if(!playing)$('rinfo').textContent=snaps.length>1?(snaps.length-1)+' Schritte aufgenommen':''}
function toggleRec(){if(playing)stop();rec=!rec;if(rec)snaps=[snap()];manualStep=-1;recUI()}
function play(){if(snaps.length<2){$('rinfo').textContent='Erst aufnehmen: mindestens ein Schritt nötig';return}rec=false;live=snap();playing=true;pi=0;start=null;sel=[];recUI();playStep()}
function playStep(){if(!playing)return;show(pi);const last=pi==snaps.length-1;pi=last?0:pi+1;const speed=+$('speed').value||1;pt=setTimeout(playStep,(last?2.5:1)/speed*1000)}
function moveStep(direction){if(snaps.length<2||rec||playing)return;manualStep=(manualStep+direction+snaps.length)%snaps.length;show(manualStep)}
function stop(){playing=false;clearTimeout(pt);if(live){load(JSON.parse(live));live=null;rebuild();draw()}recUI()}
$('brec').onclick=e=>{e.currentTarget.blur();toggleRec()};$('bplay').onclick=e=>{e.currentTarget.blur();playing?stop():play()};$('bprev').onclick=e=>{e.currentTarget.blur();moveStep(-1)};$('bnext').onclick=e=>{e.currentTarget.blur();moveStep(1)};
let dl=null;
try{if(typeof claude!=='undefined'&&claude.use)claude.use('downloads').then(x=>{dl=x}).catch(()=>{dl=null})}catch(e){dl=null}
$('bsave').onclick=async e=>{e.target.blur();if(snaps.length<2)return;const data=JSON.stringify({typ:'schraegbild-aufnahme',v:1,steps:snaps.map(s=>JSON.parse(s))});
 try{if(dl)await dl.save({filename:'konstruktion.json',data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='konstruktion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}$('rinfo').textContent='Aufnahme gespeichert'}catch(err){if(!err||err.code!='declined')$('rinfo').textContent='Speichern nicht möglich'}};
$('bload').onclick=e=>{e.target.blur();$('bfile').click()};
$('bfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.steps||d.steps.length<2||!d.steps.every(s=>Array.isArray(s)&&(s.length==7||s.length==8)))throw 0;if(playing)stop();rec=false;snaps=d.steps.map(s=>JSON.stringify(s));recUI();play()}catch(x){$('rinfo').textContent='Datei konnte nicht gelesen werden'}};r.readAsText(f)};
function sync(){$('fix').disabled=!$('ras').checked;$('step').disabled=!$('ras').checked||$('fix').checked}
document.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{c.blur();sync();draw()});
$('opts').addEventListener('input',()=>draw());
$('sz').oninput=e=>{zoom(+e.target.value,W/2,H/2)};
$('georeset').onclick=()=>{geoAngle=0;draw()};
$('geo').onchange=()=>{$('geo').blur();$('georeset').style.display=$('geo').checked?'':'none';if($('geo').checked&&!geoPos)geoPos={x:wx(W/2),y:wy(H/2)};draw()};
$('georeset').style.display='none';
function zoom(k2,mx,my){k2=Math.max(20,Math.min(150,k2));ox=mx-(mx-ox)*k2/k;oy=my-(my-oy)*k2/k;k=k2;$('sz').value=k;draw()}
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);zoom(k*(e.deltaY<0?1.1:1/1.1),p.x,p.y)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function nextP(){const u=new Set(P.map(q=>q.l));let n=0,l;do{l=String.fromCharCode(65+n%26)+(n>=26?Math.floor(n/26):'');n++}while(u.has(l));return l}
function nextL(){const u=new Set(L.map(q=>q.l));let n=0,l;do{l=LC[n%26]+(n>=26?Math.floor(n/26):'');n++}while(u.has(l));return l}
function add(x,y,cx){const e=P.find(p=>Math.hypot(p.x-x,p.y-y)<.02);if(e)return e.id;const p={id:nid++,x,y};if(cx)p.cx=cx;if($('auto').checked)p.l=nextP();P.push(p);return p.id}
function anchor(){const eps=1e-7,limit=Math.max(1,P.length+1);
 for(let n=0;n<limit;n++){let changed=false;
  P.forEach(p=>{if(!p.cx)return;const l1=L.find(l=>l.id==p.cx[0]),l2=L.find(l=>l.id==p.cx[1]);if(!l1||!l2){p.cx=null;changed=true;return}
   const a=M.get(l1.a),b=M.get(l1.b),c=M.get(l2.a),d=M.get(l2.b),d1x=b.x-a.x,d1y=b.y-a.y,d2x=d.x-c.x,d2y=d.y-c.y,den=d1x*d2y-d1y*d2x;if(Math.abs(den)<1e-9)return;
   const dx=c.x-a.x,dy=c.y-a.y,t=(dx*d2y-dy*d2x)/den,u=(dx*d1y-dy*d1x)/den;
   if(t<-eps||t>1+eps||u<-eps||u>1+eps){p.cx=null;changed=true;return}
   const nt=Math.max(0,Math.min(1,t)),nx=a.x+nt*d1x,ny=a.y+nt*d1y;
   if(Math.abs(p.x-nx)>eps||Math.abs(p.y-ny)>eps){p.x=nx;p.y=ny;changed=true}
  });
  if(!changed)break;
 }}
function rebuild(){const ok=new Set(P.map(p=>p.id));let removed=0;
 M=new Map(P.map(p=>[p.id,p]));const validSegment=(a,b)=>{const p=M.get(a),q=M.get(b);return p&&q&&Math.hypot(p.x-q.x,p.y-q.y)>1e-9};
 const oldL=L.length;L=L.filter(l=>ok.has(l.a)&&ok.has(l.b)&&validSegment(l.a,l.b));removed+=oldL-L.length;
 const oldK=K.length;K=K.filter(o=>o.s=='circle'?ok.has(o.a)&&Number.isFinite(o.r)&&o.r>0:ok.has(o.a)&&ok.has(o.b)&&validSegment(o.a,o.b));removed+=oldK-K.length;
 const oldA=A.length;A=A.filter(a=>ok.has(a.a)&&ok.has(a.b)&&ok.has(a.c));removed+=oldA-A.length;
 const oldF=F.length;F=F.filter(f=>f.p.every(i=>ok.has(i)));removed+=oldF-F.length;
 const oldBD=BD.length;BD=BD.filter(b=>ok.has(b.top)&&(b.base.k=='c'?ok.has(b.base.a)&&ok.has(b.base.b):b.base.p.every(i=>ok.has(i))));removed+=oldBD-BD.length;
 crossKey='';crossCache=[];anchor();
 if(removed)$('hint').textContent=removed+' ungültige oder abhängige Objekte entfernt.'}
function crossings(){const key=L.map(l=>{const a=M.get(l.a),b=M.get(l.b);return l.id+':'+a.x+','+a.y+','+b.x+','+b.y}).join('|');if(key==crossKey)return crossCache;
 const r=[];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const p=M.get(L[i].a),q=M.get(L[i].b),a=M.get(L[j].a),b=M.get(L[j].b),
 d1x=q.x-p.x,d1y=q.y-p.y,d2x=b.x-a.x,d2y=b.y-a.y,den=d1x*d2y-d1y*d2x;if(Math.abs(den)<1e-9)continue;
 const t=((a.x-p.x)*d2y-(a.y-p.y)*d2x)/den,v=((a.x-p.x)*d1y-(a.y-p.y)*d1x)/den;if(t>=0&&t<=1&&v>=0&&v<=1)r.push({x:p.x+t*d1x,y:p.y+t*d1y,l1:L[i].id,l2:L[j].id})}crossKey=key;crossCache=r;return r}
function nearCross(x,y){let b=null,bd=11;crossings().forEach(c=>{const d=Math.hypot(X(c.x)-x,Y(c.y)-y);if(d<bd){bd=d;b=c}});return b}
function hit(x,y,ex){let b=null,bd=11;P.forEach(p=>{const d=Math.hypot(X(p.x)-x,Y(p.y)-y);if(p.id!==ex&&d<bd){bd=d;b=p}});return b}
function lineHit(x,y){for(let i=L.length-1;i>=0;i--){const p=M.get(L[i].a),q=M.get(L[i].b),px=X(p.x),py=Y(p.y),dx=X(q.x)-px,dy=Y(q.y)-py,
 t=Math.max(0,Math.min(1,((x-px)*dx+(y-py)*dy)/(dx*dx+dy*dy)));if(Math.hypot(px+t*dx-x,py+t*dy-y)<7)return i}return -1}
const geoMetrics=()=>{
 const w=520*(geoSize/100),h=w*(643/1280);
 return{w,h,cx:X(geoPos.x),cy:Y(geoPos.y),angle:geoAngle*Math.PI/180};
};
function geoContainsScreen(x,y){
 if(!geoPos||!geoAlpha)return false;
 const g=geoMetrics(),dx=x-g.cx,dy=y-g.cy,a=-g.angle;
 const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
 if(lx< -g.w/2||lx>g.w/2||ly< -g.h||ly>0)return false;
 const px=Math.round((lx/g.w+.5)*geoImg.naturalWidth);
 const py=Math.round((ly/g.h+1)*geoImg.naturalHeight);
 if(px<0||px>=geoImg.naturalWidth||py<0||py>=geoImg.naturalHeight)return false;
 return geoAlpha[(py*geoImg.naturalWidth+px)*4+3]>20;
