<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schrägbild-Werkzeug</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--grid:#c8ccd2;--help:#a6b3c9;--bar:#f1f2f4;--acc:#d9480f;--btn:#fff;--bd:#b9bdc4;--on:#1c5fd4;--onf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--fg:#eee;--grid:#4a4f57;--help:#6c7889;--bar:#24272b;--acc:#ff8c4a;--btn:#2d3136;--bd:#555b64;--on:#6ea0ff;--onf:#111}}
:root[data-theme="dark"]{--bg:#17191c;--fg:#eee;--grid:#4a4f57;--help:#6c7889;--bar:#24272b;--acc:#ff8c4a;--btn:#2d3136;--bd:#555b64;--on:#6ea0ff;--onf:#111}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:var(--bar)}
#opts{display:flex;flex-wrap:wrap;gap:8px}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px}
.grp.full{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px}
.grp b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.65}
.g{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;padding:5px 9px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--on);color:var(--onf);border-color:var(--on)}
label{display:flex;gap:5px;align-items:center;cursor:pointer}
label:has(:disabled){opacity:.45;cursor:default}
input[type=range]{width:90px}
input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--bd);border-radius:6px;background:transparent}
select{font:inherit}
#w{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#inp{position:absolute;display:none;width:70px;font:inherit;padding:2px}
#hint{padding:4px 10px;font-size:12px;opacity:.75}
</style></head><body>
<div id="bar">
 <div class="grp full"><b>Werkzeuge</b><div class="g" id="modes"></div>
  <div class="g"><button id="undo">↶ Zurück</button><button id="clr">Alles löschen</button><button id="tog">▲ ausblenden</button></div></div>
 <div id="opts">
  <div class="grp"><b>Raster</b><div class="g" id="grids"></div><label>Größe <input type="range" id="sz" min="12" max="100" value="30"></label></div>
  <div class="grp"><b>Zeichnen</b>
   <label><input type="checkbox" id="ras" checked> Am Raster (45°-Richtungen)</label>
   <label><input type="checkbox" id="fix" checked> Feste Längen</label>
   <label><input type="checkbox" id="half" checked> Schrägachse: halbe Schritte</label>
   <label><input type="checkbox" id="len" checked> Länge am Cursor</label>
   <label><input type="checkbox" id="auto" checked> Punkte automatisch benennen</label></div>
  <div class="grp"><b>Anzeige</b>
   <label><input type="checkbox" id="lab" checked> Bezeichnungen</label>
   <label><input type="checkbox" id="cross" checked> Punkte als Kreuz</label></div>
  <div class="grp"><b>Darstellung</b>
   <label>Schriftgröße <input type="range" id="fs" min="10" max="36" value="16"></label>
   <label>Füllfarbe (nächste Fläche) <input type="color" id="fc" value="#4da3ff"></label></div>
  <div class="grp"><b>Berechnungen</b>
   <label><input type="checkbox" id="d3" checked> Winkel und Längen in 3D</label>
   <label><input type="checkbox" id="siz"> Größen anzeigen</label>
   <label><input type="checkbox" id="onlyn"> Größen nur an benannten Strecken</label>
   <label><input type="checkbox" id="leg"> Legende</label>
   <label><input type="checkbox" id="vol"> Volumen der Körper</label>
   <label><input type="checkbox" id="sol"> Lösungswege</label>
   <label>Körper-Typ <select id="btype"><option value="pyr">Pyramide / Kegel</option><option value="pri">Prisma / Zylinder</option></select></label></div>
  <div class="grp"><b>Rekorder</b>
   <div class="g"><button id="brec">● Aufnahme starten</button><button id="bplay">▶ Abspielen (Schleife)</button></div>
   <div class="g"><button id="bsave">💾 Speichern</button><button id="bload">📂 Laden</button><input type="file" id="bfile" accept=".json,application/json" style="display:none"></div>
   <label>Sekunden pro Schritt <input type="range" id="tempo" min="0.3" max="3" step="0.1" value="1.2"></label>
   <span id="rinfo" style="font-size:12px;opacity:.75"></span></div>
 </div>
</div>
<div id="w"><canvas id="c"></canvas><input id="inp" maxlength="100"></div>
<div id="hint"></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),inp=$('inp');
let P=[],L=[],K=[],A=[],F=[],BD=[],Q=[],nid=1,hist=[],start=null,sel=[],bsel=null,mode='line',grid='dots',showGrid=true,hover=null,hl=-1,hk=-1,W=0,H=0,k=30,ox=0,oy=0,fs=16,mouse={x:0,y:0},drag=null,space=false,M=new Map(),legPos=null,legR=null,legRows=[],rec=false,snaps=[],playing=false,live=null,pi=0,pt=null;
const GR='αβγδεζηθικλμνξπρστφχψω',LC='abcdefghijklmnopqrstuvwxyz',PAL=['#4da3ff','#ffb347','#6fd08c','#ff7b9c','#b48cff','#ffd84d','#4dd0c8','#ff8c66'];
const MODES=[['line','Strecke (S)'],['point','Punkt (P)'],['arc','Kreis (K)'],['style','Stil (G)'],['label','Beschriften (B)'],['text','Text (T)'],['move','Verschieben (V)'],['angle','Winkel (W)'],['face','Fläche (F)'],['body','Körper (O)'],['hand','Hand (H)'],['del','Löschen (L)']];
const KEYS={s:'line',p:'point',k:'arc',g:'style',b:'label',t:'text',v:'move',w:'angle',f:'face',o:'body',h:'hand',l:'del'};
const HINTS={line:'Punkt oder Schnittpunkt anklicken, Maus bewegen, zweiter Klick setzt das Ende. Klick auf einen vorhandenen Punkt verbindet frei. Esc bricht ab.',point:'Klick setzt einen Punkt (rastet an Schnittpunkten von Strecken ein und bleibt daran verankert).',arc:'Zwei Endpunkte eines waagerechten Durchmessers anklicken, dann Maus nach oben oder unten bewegen (oberer/unterer Halbbogen) und klicken.',label:'Punkt, Strecke, Winkelbogen oder Fläche anklicken, Namen eingeben (tiefgestellt: F_1 oder F_{12}), Enter.',text:'Klick an die gewünschte Stelle, Text eingeben und Enter drücken. Esc bricht ab.',style:'Strecke oder Kreisbogen anklicken: normal → gestrichelt → Hilfslinie.',move:'Punkt, Strecke oder Text ziehen, angrenzende Strecken wandern mit.',angle:'Nacheinander anklicken: Punkt auf Schenkel 1, Scheitelpunkt, Punkt auf Schenkel 2.',face:'Punkte der Reihe nach anklicken; ersten Punkt erneut anklicken oder Enter schließt die Fläche.',body:'Grundfläche anklicken (in die Fläche, oder eine waagerechte Strecke als Kreisdurchmesser), dann Spitze bzw. einen Punkt der Deckfläche. Typ unter Berechnungen. Löschen: in der Legende anklicken.',hand:'Zeichenfläche ziehen. Alternativ: rechte/mittlere Maustaste oder Leertaste. Mausrad zoomt.',del:'Punkt, Strecke, Kreisbogen, Winkelbogen, Fläche oder Text anklicken zum Löschen.'};
const fmt=(n,d=2)=>(+n.toFixed(d)).toString().replace('.',',');
const X=x=>ox+x*k,Y=y=>oy+y*k,wx=x=>(x-ox)/k,wy=y=>(y-oy)/k;
const S=()=>[P,L,K,A,F,BD,Q,nid],snap=()=>JSON.stringify(S()),load=a=>{[P,L,K,A,F,BD,Q,nid]=a.length==8?a:[...a.slice(0,6),[],a[6]]};
function btns(el,arr,cur,fn){el.innerHTML='';arr.forEach(([key,t])=>{const b=document.createElement('button');b.textContent=t;b.className=cur()==key?'on':'';b.onclick=()=>{fn(key);btns(el,arr,cur,fn);draw()};el.appendChild(b)})}
function ui(){btns($('modes'),MODES,()=>mode,setMode);btns($('grids'),[['dots','Punktraster'],['karo','Karo'],['off','Aus']],()=>showGrid?grid:'off',key=>{if(key=='off')showGrid=false;else{showGrid=true;grid=key}})}
function setMode(m){mode=m;start=null;sel=[];bsel=null;inp.style.display='none';$('hint').textContent=HINTS[m];cv.style.cursor=m=='hand'?'grab':m=='move'?'move':'crosshair';ui();draw()}
function resize(){const r=cv.parentNode.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}
new ResizeObserver(()=>resize()).observe($('w'));
$('tog').onclick=e=>{const o=$('opts'),h=o.style.display=='none';o.style.display=h?'flex':'none';e.target.textContent=h?'▲ ausblenden':'▼ einblenden';e.target.blur()};
const push=()=>{hist.push(snap());if(hist.length>100)hist.shift();if(rec&&!drag)setTimeout(capture,0)};
function undo(){if(playing)return;if(hist.length){if(rec&&snaps.length>1)snaps.pop();load(JSON.parse(hist.pop()));start=null;sel=[];bsel=null;rebuild();draw()}}
$('undo').onclick=e=>{e.target.blur();undo()};
$('clr').onclick=e=>{e.target.blur();if(playing)return;if(P.length||Q.length){push();P=[];L=[];K=[];A=[];F=[];BD=[];Q=[];start=null;sel=[];bsel=null;rebuild();draw()}};
/* Rekorder */
function capture(){if(!rec)return;const s=snap();if(snaps[snaps.length-1]!==s)snaps.push(s);recUI()}
function show(i){load(JSON.parse(snaps[i]));start=null;sel=[];bsel=null;rebuild();draw();$('rinfo').textContent='Schritt '+(i+1)+' von '+snaps.length}
function recUI(){$('brec').textContent=rec?'■ Aufnahme beenden':'● Aufnahme starten';$('brec').className=rec?'on':'';$('bplay').textContent=playing?'■ Stopp':'▶ Abspielen (Schleife)';$('bplay').className=playing?'on':'';$('bsave').disabled=snaps.length<2;
 if(rec)$('rinfo').textContent='Aufnahme läuft: '+(snaps.length-1)+' Schritte';else if(!playing)$('rinfo').textContent=snaps.length>1?(snaps.length-1)+' Schritte aufgenommen':''}
function toggleRec(){if(playing)stop();rec=!rec;if(rec)snaps=[snap()];recUI()}
function play(){if(snaps.length<2){$('rinfo').textContent='Erst aufnehmen: mindestens ein Schritt nötig';return}rec=false;live=snap();playing=true;pi=0;start=null;sel=[];recUI();step()}
function step(){if(!playing)return;show(pi);const last=pi==snaps.length-1;pi=last?0:pi+1;pt=setTimeout(step,(last?2.5:1)*(+$('tempo').value||1.2)*1000)}
function stop(){playing=false;clearTimeout(pt);if(live){load(JSON.parse(live));live=null;rebuild();draw()}recUI()}
$('brec').onclick=e=>{e.target.blur();toggleRec()};$('bplay').onclick=e=>{e.target.blur();playing?stop():play()};
let dl=null;
try{if(typeof claude!=='undefined'&&claude.use)claude.use('downloads').then(x=>{dl=x}).catch(()=>{dl=null})}catch(e){dl=null}
$('bsave').onclick=async e=>{e.target.blur();if(snaps.length<2)return;const data=JSON.stringify({typ:'schraegbild-aufnahme',v:1,steps:snaps.map(s=>JSON.parse(s))});
 try{if(dl)await dl.save({filename:'konstruktion.json',data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='konstruktion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}$('rinfo').textContent='Aufnahme gespeichert'}catch(err){if(!err||err.code!='declined')$('rinfo').textContent='Speichern nicht möglich'}};
$('bload').onclick=e=>{e.target.blur();$('bfile').click()};
$('bfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.steps||d.steps.length<2||!d.steps.every(s=>Array.isArray(s)&&(s.length==7||s.length==8)))throw 0;if(playing)stop();rec=false;snaps=d.steps.map(s=>JSON.stringify(s));recUI();play()}catch(x){$('rinfo').textContent='Datei konnte nicht gelesen werden'}};r.readAsText(f)};
function sync(){$('fix').disabled=!$('ras').checked;$('half').disabled=$('fix').disabled||!$('fix').checked}
document.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{c.blur();sync();draw()});
$('opts').addEventListener('input',()=>draw());$('btype').addEventListener('change',e=>e.target.blur());
$('sz').oninput=e=>{zoom(+e.target.value,W/2,H/2)};
function zoom(k2,mx,my){k2=Math.max(12,Math.min(100,k2));ox=mx-(mx-ox)*k2/k;oy=my-(my-oy)*k2/k;k=k2;$('sz').value=k;draw()}
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);zoom(k*(e.deltaY<0?1.1:1/1.1),p.x,p.y)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function nextP(){const u=new Set(P.map(q=>q.l));let n=0,l;do{l=String.fromCharCode(65+n%26)+(n>=26?Math.floor(n/26):'');n++}while(u.has(l));return l}
function add(x,y,cx){const e=P.find(p=>Math.hypot(p.x-x,p.y-y)<.02);if(e)return e.id;const p={id:nid++,x,y};if(cx)p.cx=cx;if($('auto').checked)p.l=nextP();P.push(p);return p.id}
function anchor(){for(let n=0;n<4;n++)P.forEach(p=>{if(!p.cx)return;const l1=L.find(l=>l.id==p.cx[0]),l2=L.find(l=>l.id==p.cx[1]);if(!l1||!l2){p.cx=null;return}
 const a=M.get(l1.a),b=M.get(l1.b),c=M.get(l2.a),d=M.get(l2.b),d1x=b.x-a.x,d1y=b.y-a.y,d2x=d.x-c.x,d2y=d.y-c.y,den=d1x*d2y-d1y*d2x;if(Math.abs(den)<1e-9)return;
 const t=((c.x-a.x)*d2y-(c.y-a.y)*d2x)/den;p.x=a.x+t*d1x;p.y=a.y+t*d1y})}
function rebuild(){const ok=new Set(P.map(p=>p.id));
 L=L.filter(l=>ok.has(l.a)&&ok.has(l.b));K=K.filter(o=>ok.has(o.a)&&ok.has(o.b));A=A.filter(a=>ok.has(a.a)&&ok.has(a.b)&&ok.has(a.c));F=F.filter(f=>f.p.every(i=>ok.has(i)));
 BD=BD.filter(b=>ok.has(b.top)&&(b.base.k=='c'?ok.has(b.base.a)&&ok.has(b.base.b):b.base.p.every(i=>ok.has(i))));
 M=new Map(P.map(p=>[p.id,p]));anchor()}
function crossings(){const r=[];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const p=M.get(L[i].a),q=M.get(L[i].b),a=M.get(L[j].a),b=M.get(L[j].b),
 d1x=q.x-p.x,d1y=q.y-p.y,d2x=b.x-a.x,d2y=b.y-a.y,den=d1x*d2y-d1y*d2x;if(Math.abs(den)<1e-9)continue;
 const t=((a.x-p.x)*d2y-(a.y-p.y)*d2x)/den,v=((a.x-p.x)*d1y-(a.y-p.y)*d1x)/den;if(t>=0&&t<=1&&v>=0&&v<=1)r.push({x:p.x+t*d1x,y:p.y+t*d1y,l1:L[i].id,l2:L[j].id})}return r}
function nearCross(x,y){let b=null,bd=11;crossings().forEach(c=>{const d=Math.hypot(X(c.x)-x,Y(c.y)-y);if(d<bd){bd=d;b=c}});return b}
function hit(x,y,ex){let b=null,bd=11;P.forEach(p=>{const d=Math.hypot(X(p.x)-x,Y(p.y)-y);if(p.id!==ex&&d<bd){bd=d;b=p}});return b}
function lineHit(x,y){for(let i=L.length-1;i>=0;i--){const p=M.get(L[i].a),q=M.get(L[i].b),px=X(p.x),py=Y(p.y),dx=X(q.x)-px,dy=Y(q.y)-py,
 t=Math.max(0,Math.min(1,((x-px)*dx+(y-py)*dy)/(dx*dx+dy*dy)));if(Math.hypot(px+t*dx-x,py+t*dy-y)<7)return i}return -1}
function arcPath(a,b,s){const rx=Math.abs(b.x-a.x)/2*k;ctx.ellipse(X((a.x+b.x)/2),Y((a.y+b.y)/2),rx,rx*.5,0,s=='u'?Math.PI:0,s=='u'?2*Math.PI:Math.PI)}
function arcHit(x,y){for(let i=K.length-1;i>=0;i--){const a=M.get(K[i].a),b=M.get(K[i].b),cx=X((a.x+b.x)/2),cy=Y((a.y+b.y)/2),rx=Math.abs(b.x-a.x)/2*k,ry=rx*.5,u=K[i].s=='u';
 for(let n=0;n<=40;n++){const t=(u?Math.PI:0)+Math.PI*n/40;if(Math.hypot(cx+rx*Math.cos(t)-x,cy+ry*Math.sin(t)-y)<7)return i}}return -1}
function textHit(x,y){for(let i=Q.length-1;i>=0;i--){const q=Q[i],w=halo(q.t,0,0,'','','left','','',fs,true);if(x>=X(q.x)-5&&x<=X(q.x)+w+5&&y>=Y(q.y)-fs&&y<=Y(q.y)+5)return i}return -1}
const angHit=(x,y)=>A.findIndex(a=>{const B=M.get(a.b);return Math.abs(Math.hypot(X(B.x)-x,Y(B.y)-y)-26)<8});
function inFace(f,x,y){let c=false;const q=f.p.map(i=>M.get(i));for(let i=0,j=q.length-1;i<q.length;j=i++){const a=q[i],b=q[j],ay=Y(a.y),by=Y(b.y);
 if((ay>y)!=(by>y)&&x<(X(b.x)-X(a.x))*(y-ay)/(by-ay)+X(a.x))c=!c}return c}
const faceAt=(x,y)=>{let r=-1;F.forEach((f,i)=>{if(inFace(f,x,y))r=i});return r};
/* 3D-Modell: x rechts, z oben, Tiefe y; Tiefenstrecke der Länge l erscheint nach rechts oben mit den Komponenten 0,5·l */
function solve3d(){const q=.5,T=new Map(),e=.02;let comp=0;
 const axis=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dy)<e)return{x:dx,y:0,z:0};if(Math.abs(dx)<e)return{x:0,y:0,z:-dy};
  if(Math.abs(Math.abs(dx)-Math.abs(dy))<e&&dx*dy<0)return{x:0,y:Math.abs(dx)/q*Math.sign(dx),z:0};return null};
 const ps=P.filter(p=>L.some(l=>l.a==p.id||l.b==p.id));
 const run=()=>{let ch=true,n=0;while(ch&&n++<60){ch=false;
  L.forEach(l=>{const a=M.get(l.a),b=M.get(l.b),ta=T.get(a.id),tb=T.get(b.id);
   if(ta&&!tb){const v=axis(a,b);if(v){T.set(b.id,{x:ta.x+v.x,y:ta.y+v.y,z:ta.z+v.z,c:ta.c});ch=true}}
   else if(tb&&!ta){const v=axis(b,a);if(v){T.set(a.id,{x:tb.x+v.x,y:tb.y+v.y,z:tb.z+v.z,c:tb.c});ch=true}}});
  P.forEach(p=>{for(const l of L){if(l.a==p.id||l.b==p.id)continue;const a=M.get(l.a),b=M.get(l.b),ta=T.get(a.id),tb=T.get(b.id);if(!ta||!tb||ta.c!=tb.c)continue;
   const dx=b.x-a.x,dy=b.y-a.y,t=((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy);if(t<-e||t>1+e||Math.hypot(a.x+t*dx-p.x,a.y+t*dy-p.y)>e)continue;
   const v={x:ta.x+t*(tb.x-ta.x),y:ta.y+t*(tb.y-ta.y),z:ta.z+t*(tb.z-ta.z),c:ta.c},o=T.get(p.id);
   if(!o){T.set(p.id,v);ch=true;break}
   if(o.c!=ta.c){const ddx=v.x-o.x,ddy=v.y-o.y,ddz=v.z-o.z,oc=o.c;for(const w of T.values())if(w.c==oc){w.x+=ddx;w.y+=ddy;w.z+=ddz;w.c=ta.c}ch=true;break}}})}};
 for(const p of ps)if(!T.has(p.id)){T.set(p.id,{x:0,y:0,z:0,c:comp++});run()}
 return T}
function lenInfo(l,T){const a=M.get(l.a),b=M.get(l.b),ta=T&&T.get(a.id),tb=T&&T.get(b.id);
 const c=ta&&tb&&ta.c==tb.c?[tb.x-ta.x,tb.y-ta.y,tb.z-ta.z]:[b.x-a.x,b.y-a.y,0],nz=c.map(x=>Math.abs(x)).filter(x=>x>1e-6);
 return{v:Math.hypot(...c),s:nz.length>1?'√('+nz.map(x=>fmt(x)+'²').join('+')+')':''}}
function areaInfo(ids,T){const t=T&&ids.map(i=>T.get(i));let q,d2=false;
