<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
/* ---------- Bruchrechnung ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);

const key=m=>Object.keys(m).sort().map(k=>k+m[k]).join(','),deg=m=>Object.values(m).reduce((s,e)=>s+Math.max(e,0),0);
const mulm=(a,b)=>{const r={...a};for(const k in b){r[k]=(r[k]||0)+b[k];if(!r[k])delete r[k]}return r};

function tok(s){s=s.replace(/²/g,'^2').replace(/³/g,'^3').replace(/[−–]/g,'-').replace(/[·×⋅]/g,'*').replace(/[÷:]/g,'/').trim();
 const re=/\s*(\d+(?:[.,]\d+)?|\p{L}|[-+*\/^()=])/uy,t=[];let m;

 const st=t=>t&&(/^\d/.test(t)||/^\p{L}$/u.test(t)||t==='(');
 function expr(){let a=term();while(pk()==='+'||pk()==='-'){const o=nx();a={t:'b',o,a,b:term()}}return a}
 function term(){let a=un();for(;;){const t=pk();if(t==='*'||t==='/'){nx();a={t:'b',o:t,a,b:un()}}else if(st(t))a={t:'b',o:'i',a,b:pw()};else break}return a}
 function un(){if(pk()==='-'){nx();return{t:'n',a:un()}}if(pk()==='+'){nx();return un()}return pw()}
 function pw(){let a=at();if(pk()==='^'){nx();const e=pk()==='-'?(nx(),{t:'n',a:at()}):at();a={t:'b',o:'^',a,b:e}}return a}

  if(/^\d/.test(t)){const p=t.replace(',','.').split('.');return{t:'c',v:F(+(p[0]+(p[1]||'')),Math.pow(10,(p[1]||'').length)),s:t}}
  if(/^\p{L}$/u.test(t))return{t:'v',n:t};
  if(t==='('){const e=expr();if(nx()!==')')throw Error('Eine Klammer wird nicht geschlossen.');return{t:'p',a:e}}
  throw Error('Unerwartetes Zeichen „'+t+'“.')}
 const r=expr();if(i<T.length)throw Error('Die Eingabe ist nicht verständlich (Klammern prüfen).');return r}
function ev(n){switch(n.t){
 case'c':return[{c:n.v,m:{}}];case'v':return[{c:F(1),m:{[n.n]:1}}];case'p':return ev(n.a);case'n':return ev(n.a).map(ngt);
 case'b':{const A=ev(n.a),B=ev(n.b);
  if(n.o==='+')return A.concat(B);if(n.o==='-')return A.concat(B.map(ngt));if(n.o==='*'||n.o==='i')return pm(A,B);
  if(n.o==='/'){const D=merge(B);if(!D.length)throw Error('Division durch 0.');if(D.length>1)throw Error('Division durch eine Summe wird nicht unterstützt.');return pm(A,[{c:fd(F(1),D[0].c),m:ngm(D[0].m)}])}

  let r=[{c:F(1),m:{}}];for(let i=0;i<E[0].c[0];i++)r=pm(r,A);return r}}}

const GR={π:'\\pi',ρ:'\\rho',α:'\\alpha',β:'\\beta',γ:'\\gamma',δ:'\\delta',φ:'\\varphi',ω:'\\omega',λ:'\\lambda',η:'\\eta',Δ:'\\Delta'},vt=n=>GR[n]||n;

  if(n.o==='+'||n.o==='-')return A+' '+n.o+' '+B;if(n.o==='*')return A+'\\cdot '+B;

 if(an!==1||!nu.length)nu.unshift(String(an));if(d!==1)de.unshift(String(d));

const opAdd=t=>'{'+(t.c[0]>0?'-':'+')+'}\\,'+tt(t,false);
const opDiv=t=>':\\,'+(t.c[0]<0?'\\left('+tt(t,true)+'\\right)':tt(t,false));

function solveEq(str,v,opt){
 const rows=[],add=(t,o,n,x)=>{if(rows.length)rows[rows.length-1].o=o;rows.push({t,o:null,n,...x})};

 let L=merge(P1),R=merge(P2);const eqs=()=>ptx(L)+' = '+ptx(R),s2=eqs();if(br?sq(s2)!==sq(s1):(P1.length>L.length||P2.length>R.length))add(s2,null,'Zusammenfassen');

 if(!has(L)&&!has(R))throw Error('Die Variable '+v+' kommt in der Gleichung nicht vor.');

   if(!R.length)add('\\mathbb{L} = \\mathbb{Q}',null,'Wahre Aussage: jede Zahl ist Lösung',{sol:1});

  else{add(lv+'\\left('+ptx(D)+'\\right) = '+ptx(R),null,v+' ausklammern');RS='\\frac{'+ptx(R)+'}{'+ptx(D)+'}';add(lv+' = '+RS,':\\,\\left('+ptx(D)+'\\right)','Durch die Klammer teilen')}

const vars=str=>{try{return[...new Set(tok(str).filter(t=>/^\p{L}$/u.test(t)&&t!=='π'))]}catch(e){return[]}};
function fillVars(vs,sel){const s=$('vsel');s.innerHTML=vs.map(v=>`<option${v===sel?' selected':''}>${v}</option>`).join('')}
function genEq(){const r=rng(S.seed),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),nz=(a,b)=>{let v;do v=ri(a,b);while(!v);return v},co=()=>nz(2,9)*(r()<.5?-1:1);
 const on=TY.map((_,i)=>i).filter(i=>$('t'+i).checked),ty=on.length?on[ri(0,on.length-1)]:2,ig=$('ganz').checked,x0=ri(-9,9);
 const sg=n=>n>0?'+'+n:''+n,L=(a,b)=>(a==1?'x':a==-1?'-x':a+'x')+(b?sg(b):''),Br=(a,b)=>a+'(x'+(b?sg(b):'')+')';
 let a=co(),c=co(),b,d,s;while(c===a)c=co();
 if(ty===0){b=nz(-9,9);c=ig?x0+b:ri(-15,15);s=`x${sg(b)}=${c}`}
 else if(ty===1){c=ig?a*x0:ri(-30,30);s=`${a}x=${c}`}
 else if(ty===2){b=nz(-12,12);d=ig?a*x0+b:ri(-20,20);s=`${L(a,b)}=${d}`}
 else if(ty===3){b=nz(-12,12);d=ig?a*x0+b-c*x0:ri(-12,12);s=`${L(a,b)}=${L(c,d)}`}
 else if(ty===4){b=nz(-9,9);d=ig?a*(x0+b):ri(-30,30);s=`${Br(a,b)}=${d}`}
 else if(ty===5){b=nz(-9,9);d=ig?a*(x0+b)-c*x0:ri(-12,12);s=`${Br(a,b)}=${L(c,d)}`}
 else if(ty===6){d=nz(-9,9);b=ig?c*(x0+d)-a*x0:ri(-12,12);s=`${L(a,b)}=${Br(c,d)}`}
 else{b=nz(-9,9);d=nz(-9,9);s=`${Br(a,b)}=${Br(c,d)}`}
 S.cur={str:s,v:'x'};S.task='Löse die Gleichung nach x.';S.leg='';run()}
function genFo(){const r=rng(S.seed),on=GRP.filter((_,i)=>$('g'+i).checked),pool=FO.filter(f=>on.includes(f[0]));
 const list=pool.length?pool:FO,f=list[Math.floor(r()*list.length)],lhs=tok(f[1])[0];
 const ok=vars(f[1]).filter(v=>v!==lhs&&(()=>{try{solveEq(f[1],v,{root:1});return 1}catch(e){return 0}})());
 const v=ok[Math.floor(r()*ok.length)];S.cur={str:f[1],v};S.leg=f[2];fillVars(vars(f[1]),v);run()}
function run(){const c=S.cur;S.task=c.v?(S.m==='eq'?'Löse die Gleichung nach '+c.v+'.':'Stelle die Formel nach '+c.v+' um.'):'';
 try{S.rows=solveEq(c.str,c.v,{root:S.m==='fo',set:S.m==='eq'}).rows;S.err=''}catch(e){S.rows=[];S.err=e.message}S.k=0;show()}
function gen(){S.m==='eq'?genEq():genFo()}
function setHash(){location.hash=(S.m==='eq'?'gl-':'fo-')+S.seed;$('seedin').value=S.seed}
function newTask(){S.seed=10000+Math.floor(Math.random()*89999);setHash();gen()}
function own(){const str=$('inp').value;if(!str.trim())return;const vs=vars(str);let v;
 if(S.m==='eq'){v=vs.includes('x')?'x':vs[0];fillVars(vs,v)}else{v=$('vsel').value;if(!vs.includes(v))v=vs[vs.length-1];fillVars(vs,v)}
 S.cur={str,v:v||'x'};S.leg='';run()}
/* ---------- Anzeige ---------- */
const plain=t=>{let s=t.replace(/\\\{/g,'‹').replace(/\\\}/g,'›').replace(/\\left|\\right|\\Big|\\,|\\;|\\text|\\ /g,'');
 for(let i=0;i<3;i++)s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\[(\d)\]\{([^{}]*)\}/g,'√$1($2)').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)');
 return s.replace(/\\cdot/g,'·').replace(/\\pi/g,'π').replace(/\\rho/g,'ρ').replace(/\\quad/g,'   ').replace(/\\downarrow/g,'↓').replace(/\\approx/g,'≈').replace(/\\checkmark/g,'✓').replace(/\\mathbb\{(.)\}/g,'$1').replace(/\^\{(\d)\}/g,'^$1').replace(/[{}]/g,'').replace(/-/g,'−').replace(/‹/g,'{').replace(/›/g,'}')};
function typeset(){const box=$('rows'),els=[...box.querySelectorAll('.m')];els.forEach(e=>e.textContent=plain(e.dataset.tex));
 if(!$('mjx').checked||!(window.MathJax&&MathJax.tex2svgPromise))return;
 els.forEach(e=>{const t=e.dataset.tex;MathJax.tex2svgPromise(t,{display:false}).then(n=>{if(e.isConnected&&e.dataset.tex===t)e.replaceChildren(n)}).catch(()=>{})})}
const mj=t=>`<span class="m" data-tex="${esc(t)}"></span>`;
function show(){const vis=S.rows;
 $('task').innerHTML=esc(S.task)+(S.leg?'<br><small>'+esc(S.leg)+'</small>':'');
 if(S.err){$('rows').innerHTML='<p class="err">'+esc(S.err)+'</p>';nav(0,0);return}
 if(!vis.length){$('rows').innerHTML='<p class="hint">Wähle eine Aufgabe oder gib eine Gleichung ein.</p>';nav(0,0);return}
 S.k=Math.max(0,Math.min(S.k,vis.length-1));let h='';
 const A=$('arr').checked,D=$('dec').checked,svg='<svg class="ar" viewBox="0 0 30 40" preserveAspectRatio="none"><path d="M27 2C3 6 3 34 25 38" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ah)"/></svg>';
 for(let i=0;i<=S.k;i++){const r=vis[i],sc=r.sol?' sol':'',bar=i<S.k&&r.o?'\\Big|\\ '+r.o:'',dc=D&&r.dec?' \\approx '+r.dec:'',p=r.t.split(' = '),u=x=>r.sol?'<span class="u">'+x+'</span>':x;
  if(p.length===2)h+=`<div class="c l${sc}">${mj(p[0])}</div><div class="c eqc${sc}">${mj('=')}</div><div class="c r${sc}">${mj(p[1]+dc)}</div><div class="c bar">${bar?mj(bar):''}</div><div class="c note">${esc(r.n||'')}</div>`;
  else h+=`<div class="c full${sc}">${mj(r.t)} <span class="note">${esc(r.n||'')}</span></div>`;
  if(A&&i<S.k&&r.o)h+=`<div class="c arc"><div class="aL">${mj(r.o)}${svg}</div></div><div></div><div class="c arc"><div class="aR">${svg}${mj(r.o)}</div></div><div></div><div></div>`}
 h='<div class="g'+(A?' wa':'')+'">'+h+'</div>';
 $('rows').innerHTML=h;nav(S.k,vis.length);typeset()}
function nav(k,n){$('cnt').textContent=n?`Schritt ${k+1} von ${n}`:'';$('b0').disabled=$('b1').disabled=k<=0;$('b2').disabled=$('b3').disabled=k>=n-1}
const go=d=>{const n=S.rows.length;S.k=d==='f'?0:d==='l'?n-1:S.k+d;show()};
/* ---------- Oberfläche ---------- */
function ui(){document.querySelectorAll('#tm button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.m));document.querySelectorAll('#ts button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.s));
 const rnd=S.s==='rnd',eq=S.m==='eq';$('pEq').style.display=rnd&&eq?'':'none';$('pFo').style.display=rnd&&!eq?'':'none';$('pOwn').style.display=rnd?'none':'';
 $('pSeed').style.display=rnd?'':'none';$('pVar').style.display=!eq?'':'none';
 $('hint').textContent=eq?'Mit Klammern, Brüchen (a/b), Dezimalzahlen (0,5) und ^ für Potenzen. Gelöst wird nach x.':'Formel mit Variablen eingeben, z. B. A=(a+c)/2*h oder V=π*r^2*h (* für Mal, π für Pi). Dann die Zielgröße wählen.';
 $('inp').placeholder=eq?'z. B. 3x + 2 = 5x − 8':'z. B. A = (a + c)/2 · h'}
TY.forEach((t,i)=>$('types').insertAdjacentHTML('beforeend',`<label><input type="checkbox" id="t${i}" checked> ${esc(t)}</label>`));
GRP.forEach((g,i)=>$('grp').insertAdjacentHTML('beforeend',`<label><input type="checkbox" id="g${i}" checked> ${g}</label>`));
['(',')','^','²','π','·','/'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{const i=$('inp');i.setRangeText(c,i.selectionStart,i.selectionEnd,'end');i.focus()};$('sym').appendChild(b)});
document.querySelectorAll('#tm button').forEach(b=>b.onclick=()=>{S.m=b.dataset.m;ui();if(S.s==='rnd')newTask();else{S.rows=[];S.err='';S.task='';S.cur=null;$('inp').value.trim()?own():show()}});
document.querySelectorAll('#ts button').forEach(b=>b.onclick=()=>{S.s=b.dataset.s;ui();if(S.s==='rnd')newTask();else{S.rows=[];S.task='';S.err='';show();$('inp').focus()}});
$('vbtn').onclick=e=>{e.stopPropagation();$('pop').hidden=!$('pop').hidden};$('pop').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>$('pop').hidden=true);
$('vall').onclick=()=>{TY.forEach((_,i)=>$('t'+i).checked=true);gen()};$('vnone').onclick=()=>{TY.forEach((_,i)=>$('t'+i).checked=false)};
TY.forEach((_,i)=>$('t'+i).onchange=gen);GRP.forEach((_,i)=>$('g'+i).onchange=gen);$('ganz').onchange=gen;
$('new').onclick=newTask;$('seedin').onchange=e=>{S.seed=Math.abs(+e.target.value|0);setHash();gen()};
$('go').onclick=own;$('inp').onkeydown=e=>{if(e.key==='Enter')own()};
$('vsel').onchange=()=>{if(S.cur){S.cur.v=$('vsel').value;run()}};
['arr','dec','mjx'].forEach(i=>$(i).onchange=show);
$('b0').onclick=()=>go('f');$('b1').onclick=()=>go(-1);$('b2').onclick=()=>go(1);$('b3').onclick=()=>go('l');
document.onkeyup=e=>{if(e.key===' '&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))e.preventDefault()};
document.onkeydown=e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key===' '){e.preventDefault();if(S.s==='rnd')newTask()}else if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1)}};
let fs=1.6;const sf=d=>{fs=Math.max(.9,Math.min(2.4,fs+d));document.documentElement.style.setProperty('--fs',fs+'rem')};$('fm').onclick=()=>sf(-.15);$('fp').onclick=()=>sf(.15);
$('th').onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
$('hide').onclick=()=>{const m=$('menu');m.style.display=m.style.display==='none'?'':'none';$('hide').textContent=m.style.display==='none'?'Menü einblenden':'Menü ausblenden'};
function fromHash(){const h=/^#(gl|fo)-(\d+)$/.exec(location.hash);if(!h)return false;const m=h[1]==='gl'?'eq':'fo';if(S.seed===+h[2]&&S.m===m&&S.s==='rnd')return true;S.m=m;S.s='rnd';S.seed=+h[2];$('seedin').value=S.seed;ui();gen();return true}
window.addEventListener('hashchange',fromHash);
ui();if(!fromHash())newTask();
</script></body></html>
