<script>

const KC=.5*Math.SQRT1_2,KS=KC,VV=[KC,-1,KS];
const D={wuerfel:{n:'Würfel',g:'des Würfels',f:[['a','Kantenlänge a']],v:{a:4}},

zylinder:{n:'Kreiszylinder',g:'des Kreiszylinders',f:[['r','Radius r'],['h','Höhe h']],v:{r:2.5,h:5}},
prisma:{n:'Prisma',g:'des Prismas',f:[],v:{a:4,b:5,c:2,ha:3,e:6,f:4,p:2,m:2,h:5}},
kugel:{n:'Kugel',g:'der Kugel',f:[['r','Radius r']],v:{r:3}}};
const VIEWS=[['s','Schrägbild'],['n','Netz'],['z','Zweitafelbild']];
let B='wuerfel',BT='dg',PV='vorn',ZV='st',STP=99,OPEN=false,TASK=false,STEPMODE=false,SOLSTEP=Infinity,ST={t:[]},FS=13,LW=1;const STPv={s:99,n:99,z:99},STs={s:[],n:[],z:[]},VWs={s:true,n:false,z:false},ZLs={prisma:'2'},SH={pt:true,ed:true,val:true,fl:true,cap:true,col:true,hl:true};
const P={};for(const k in D)P[k]={...D[k].v};
const $=id=>document.getElementById(id);
const n=x=>(Math.round(x*100)/100).toLocaleString('de-DE',{maximumFractionDigits:2}),cm=x=>n(x)+' cm',f1=x=>x.toFixed(1);
const PL=(q,c)=>`<polyline class="${c}" points="${q.map(z=>f1(z[0])+','+f1(z[1])).join(' ')}"/>`;
const PG=(q,c)=>PL(q,c).replace('polyline','polygon');
const LN=(a,b,c)=>`<line class="${c}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"/>`;
const TX=(q,t,c='',an='middle')=>{let r='';if(/^(d[ghs]?|r)$/.test(c)){const w=t.replace(/<[^>]+>/g,'').length*FS*.6+10,x=an=='middle'?q[0]-w/2:an=='start'?q[0]-5:q[0]-w+5;r=`<rect class="lb" x="${f1(x)}" y="${f1(q[1]-FS/2-3)}" width="${f1(w)}" height="${f1(FS+6)}" rx="3"/>`}return r+`<text class="t ${c}" x="${f1(q[0])}" y="${f1(q[1])}" text-anchor="${an}" dominant-baseline="central">${t}</text>`};
const head=(t,s)=>TX([16,26],t,'b','start')+(s?TX([16,46],s,'m','start'):'');
const SUB=(a,b)=>`${a}<tspan baseline-shift="sub" font-size="9">${b}</tspan>`;
function fit(pts,mx=60,my=64){const X=pts.map(q=>q[0]),Y=pts.map(q=>q[1]),x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y),s=Math.min((720-2*mx)/((x1-x0)||1),(460-2*my)/((y1-y0)||1)),ox=(720-s*(x1-x0))/2-s*x0,oy=(460+s*(y1-y0))/2+s*y0;const g=q=>[ox+s*q[0],oy-s*q[1]];g.s=s;return g}
const sub=(p,q)=>p.map((x,i)=>x-q[i]),cr=(u,v)=>[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],dot=(u,v)=>u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
function poly(t,p){const a=p.a;if(t=='pyramide'){const b=p.b,h=p.h;return{V:[[0,0,0],[a,0,0],[a,b,0],[0,b,0],[a/2,b/2,h]],F:[[0,3,2,1],[0,1,4],[1,2,4],[2,3,4],[3,0,4]]}}
const b=t=='wuerfel'?a:p.b,c=t=='wuerfel'?a:p.c;return{V:[[0,0,0],[a,0,0],[a,b,0],[0,b,0],[0,0,c],[a,0,c],[a,b,c],[0,b,c]],F:[[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]}}

f.forEach((v,k)=>{const w=f[(k+1)%f.length],i=Math.min(v,w),j=Math.max(v,w),key=i+'-'+j;E[key]=E[key]||{i,j,hid:true,fr:false,up:false};if(vis)E[key].hid=false;if(nv[1]<-1e-9)E[key].fr=true;if(nv[2]>1e-9)E[key].up=true})});return Object.values(E)}
function circ(vf,r,z,Qf){const T=2*Math.PI,N=720,A=[],R=[];
for(let i=0;i<N;i++){const a=T*i/N,b=T*(i+1)/N;A.push(a);if((vf(a)>0)!=(vf(b)>0)){let lo=a,hi=b;const s=vf(a)>0;for(let k=0;k<40;k++){const m=(lo+hi)/2;(vf(m)>0)==s?lo=m:hi=m}const x=(lo+hi)/2;A.push(x);R.push(x)}}
A.push(T);const Q=Qf||(a=>[r*Math.cos(a),r*Math.sin(a),z]),out=[];let cur=null;
for(let i=0;i<A.length-1;i++){const h=vf((A[i]+A[i+1])/2)<=0;if(!cur||cur.hid!=h){cur={hid:h,pts:[Q(A[i])]};out.push(cur)}cur.pts.push(Q(A[i+1]))}

const pj=q=>[q[0]+KC*q[1],q[2]+KS*q[1]];
function lbl(a,b,t,C,d=8+FS*.4,c='d'){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;if(nx*(mx-C[0])+ny*(my-C[1])<0){nx=-nx;ny=-ny}
const an=nx>.4?'start':nx<-.4?'end':'middle';return an=='middle'?TX([mx+nx*(d+FS*.3),my+ny*(d+FS*.3)],t,c,an):TX([mx+nx*d,my+ny*d*.4],t,c,an)}
const BN={dg:'Gleichschenkliges Dreieck',dr:'Rechtwinkliges Dreieck',al:'Allgemeines Dreieck',pa:'Parallelogramm',tr:'Gleichschenkliges Trapez',ra:'Raute',dk:'Drachenviereck',se:'Regelmäßiges Sechseck'};
const BF={dg:[['a','Grundseite a'],['ha','Höhe h<sub>a</sub>']],dr:[['a','Kathete a'],['b','Kathete b']],al:[['a','Grundseite a'],['ha','Höhe h<sub>a</sub>'],['p','Versatz p']],pa:[['a','Seite a'],['b','Seite b'],['ha','Höhe h<sub>a</sub>']],tr:[['a','Grundseite a'],['c','Deckseite c'],['ha','Höhe h<sub>a</sub>']],ra:[['e','Diagonale e'],['f','Diagonale f']],dk:[['e','Diagonale e (Symmetrieachse)'],['f','Diagonale f'],['m','Abschnitt m von unten']],se:[['a','Seite a']]};
const FLD=t=>t=='prisma'?[...BF[BT],['h','Körperhöhe h']]:D[t].f;
const NT=s=>SH.val?s:s.split(' = ')[0],NMS={ha:SUB('h','a')};
const bad=(t,p)=>t!='prisma'?'':BT=='pa'&&p.b<=p.ha?'Die Seite b muss größer sein als die Höhe ha.':BT=='dk'&&p.m>=p.e?'Der Abschnitt m muss kleiner sein als die Diagonale e.':'';
const RK=(t,k)=>k=='h'||(t=='quader'&&k=='c')?'kh':'kg';
const DEFS='<defs><marker id="ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" style="stroke:var(--mut)" stroke-width="1.2"/></marker></defs>';
function bdef(p){const{a,b,c,e,f,ha,m}=p,pv=p.p;let q,nm,aux=[];
if(BT=='dg'){q=[[0,0],[a,0],[a/2,ha]];nm=['a','s','s'];aux=[[[a/2,0],[a/2,ha],'ha']]}
else if(BT=='dr'){q=[[0,0],[a,0],[0,b]];nm=['a','c','b']}
else if(BT=='al'){q=[[0,0],[a,0],[pv,ha]];nm=['a','b','c'];aux=[[[pv,0],[pv,ha],'ha']]}
else if(BT=='pa'){const pp=Math.sqrt(Math.max(b*b-ha*ha,0));q=[[0,0],[a,0],[a+pp,ha],[pp,ha]];nm=['a','b','a','b'];aux=[[[pp,0],[pp,ha],'ha']]}
else if(BT=='tr'){const o=(a-c)/2;q=[[0,0],[a,0],[a-o,ha],[o,ha]];nm=['a','d','c','d'];aux=[[[o,0],[o,ha],'ha']]}
else if(BT=='dk'){q=[[f/2,0],[f,m],[f/2,e],[0,m]];nm=['a','b','b','a'];aux=[[[f/2,0],[f/2,e],'e'],[[0,m],[f,m],'f']]}
else if(BT=='ra'){q=[[e/2,0],[e,f/2],[e/2,f],[0,f/2]];nm=['a','a','a','a'];aux=[[[0,f/2],[e,f/2],'e'],[[e/2,0],[e/2,f],'f']]}
else{const k=a*Math.sqrt(3)/2;q=[[a/2,0],[1.5*a,0],[2*a,k],[1.5*a,2*k],[a/2,2*k],[0,k]];nm=['a','a','a','a','a','a']}

const prismM=(q,h)=>{const n_=q.length;return{V:[...q.map(u=>[u[0],u[1],0]),...q.map(u=>[u[0],u[1],h])],F:[q.map((_,i)=>n_-1-i),q.map((_,i)=>n_+i),...q.map((_,i)=>[i,(i+1)%n_,n_+(i+1)%n_,n_+i])]}};
const prismF=(q,h)=>({V:[...q.map(u=>[u[0],0,u[1]]),...q.map(u=>[u[0],h,u[1]])],F:prismM(q,h).F});
const cen=q=>[q.reduce((s,z)=>s+z[0],0)/q.length,q.reduce((s,z)=>s+z[1],0)/q.length];
function lblp(a,b,t,lp,c){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(lp[0])return TX([mx+lp[0]*8,my],t,c,lp[0]>0?'start':'end');return TX([mx,my+lp[1]*(8+FS*.6)],t,c)}
function rightAngle(m,a,b){const R=26,a1=Math.atan2(a[1]-m[1],a[0]-m[0]),a2=Math.atan2(b[1]-m[1],b[0]-m[0]);let da=a2-a1;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;

function schraeg(t,p){
const PR=[],VL=[],C=[360,230];let tx=[],pjx=pj,sbt='Verzerrungswinkel 45° · Verkürzungsfaktor 0,5';
const add=(pts,s,o={})=>{const q={pts,st:s,...o};PR.push(q);return q};
const vls=(m,N)=>m.V.forEach((v,i)=>VL.push({p:v,t:N[i],s:Math.min(...PR.filter(q=>q.i==i||q.j==i).map(q=>q.st))}));

const m=poly(t,p),E=edges(m),a=p.a,b=t=='wuerfel'?a:p.b,c=t=='wuerfel'?a:p.c,h=p.h,py=t=='pyramide',N=py?'ABCDS':'ABCDEFGH';

o=[SEC('Grundfläche '+AG+' ('+BN[BT]+')',...gr,EQ(AG,ag)),SEC('Volumen V',EQ('V',[`${AG} · ${V('h')}`,`${n(G)} cm² · ${Nv('h')}`,val(G*h,'cm³')],1)),SEC('Oberflächeninhalt '+AO,TXT('Umfang der Grundfläche'),EQ('U',ue),TXT('Mantelfläche (Rechtecke nebeneinander)'),EQ(AM,[`U · ${V('h')}`,`${n(U)} cm · ${Nv('h')}`,val(U*h,'cm²')]),TXT('Oberflächeninhalt'),EQ(AO,[`2 · ${AG} + ${AM}`,`2 · ${n(G)} cm² + ${n(U*h)} cm²`,val(2*G+U*h,'cm²')],1))]}

TXT('Grundfläche'),EQ(AG,[`π · ${V('r')}²`,`π · (${Nv('r')})²`,val(G,'cm²')]),TXT('Mantelfläche'),EQ(AM,[`π · ${V('r')} · ${Ss('s')}`,`π · ${Nv('r')} · ${Sn(s)}`,val(M,'cm²')]),
TXT('Oberflächeninhalt'),EQ(AO,[`${AG} + ${AM}`,`${n(G)} cm² + ${n(M)} cm²`,val(G+M,'cm²')],1))]}
else if(t=='zylinder'){const G=PI*r*r,M=2*PI*r*h;
o=[SEC('Volumen V',EQ('V',[`π · ${V('r')}² · ${V('h')}`,`π · (${Nv('r')})² · ${Nv('h')}`,`π · ${n(r*r)} cm² · ${Nv('h')}`,val(G*h,'cm³')],1)),
SEC('Oberflächeninhalt '+AO,TXT('Grund- und Deckfläche (zwei gleiche Kreise)'),EQ(AG,[`π · ${V('r')}²`,`π · (${Nv('r')})²`,val(G,'cm²')]),TXT('Mantelfläche (Rechteck mit Umfang 2πr und Höhe h)'),EQ(AM,[`2 · π · ${V('r')} · ${V('h')}`,`2 · π · ${Nv('r')} · ${Nv('h')}`,val(M,'cm²')]),

const LAGE2=['quader','zylinder','prisma'],zl=t=>LAGE2.includes(t)?(ZLs[t]||'1'):'1';
const VK=['s','n','z'],VN={s:'Schrägbild',n:'Netz',z:'Zweitafelbild'},ZMs={s:{z:1,x:0,y:0},n:{z:1,x:0,y:0},z:{z:1,x:0,y:0}};

function figs(){$('figs').innerHTML=VK.map(k=>`<section class="fig card" id="fg_${k}" hidden><div class="fh"><b>${VN[k]}</b><span class="sp"></span><button data-zm="-" data-f="${k}" title="Verkleinern">−</button><span class="mut" id="zl_${k}">100 %</span><button data-zm="+" data-f="${k}" title="Vergrößern">+</button><button data-zm="0" data-f="${k}" title="Zoom zurücksetzen">⟲</button><button data-png="${k}" class="pngb">Als PNG speichern</button></div><div id="sb_${k}" class="sbar"></div><svg id="sv_${k}" viewBox="0 0 720 460"></svg></section>`).join('')}
function applyVB(k){const z=ZMs[k],w=720/z.z,h=460/z.z;z.x=Math.max(0,Math.min(720-w,z.x));z.y=Math.max(0,Math.min(460-h,z.y));const sv=$('sv_'+k);sv.setAttribute('viewBox',`${z.x} ${z.y} ${w} ${h}`);$('zl_'+k).textContent=Math.round(z.z*100)+' %';sv.style.touchAction=z.z>1?'none':'pan-y'}
function zoomAt(k,f,cx,cy){const z=ZMs[k],nz=Math.max(1,Math.min(8,z.z*f));z.x=cx-(cx-z.x)*z.z/nz;z.y=cy-(cy-z.y)*z.z/nz;z.z=nz;applyVB(k)}

else if(z.z>1){z.x-=(e.clientX-o[0])/r.width*720/z.z;z.y-=(e.clientY-o[1])/r.height*460/z.z;applyVB(k)}
PT[e.pointerId]=[e.clientX,e.clientY]});
['pointerup','pointercancel'].forEach(n=>sv.addEventListener(n,e=>{delete PT[e.pointerId]}))}
const resetSteps=()=>{for(const k of VK)STPv[k]=99};
function rndTask(){const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),p=P[B];FLD(B).forEach(([k])=>p[k]=r(2,9));
if(B=='prisma'){if(BT=='pa'){p.ha=r(2,5);p.b=p.ha+r(1,4)}if(BT=='tr')p.c=r(1,Math.max(1,p.a-1));if(BT=='dk')p.m=r(1,p.e-1);if(BT=='al')p.p=r(1,p.a)}}

if(pv){const o=isP?[['vorn','Grundfläche vorn (Höhe nach hinten)'],['st','Stehend']]:[['gf','Grundfläche vorn'],['st','Stehend'],['li','Liegend (Mantelfläche vorn)']],cur=isP?PV:ZV;$('pvsel').innerHTML=o.map(v=>`<option value="${v[0]}"${v[0]==cur?' selected':''}>${v[1]}</option>`).join('')}

async function png(k){if(!DL)return;const sv=$('sv_'+k),cs=getComputedStyle(sv);
